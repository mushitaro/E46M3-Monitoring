name: Autonomy class

# Which changes may merge without a person: the table in .github/autonomy.json, applied by
# scripts/autonomy-class.mjs to the paths a pull request changes (docs/AUTONOMY.md §5). The agent
# that wrote the change does not decide; this does.
#
# `auto` — every changed path is wording, an example, a guide topic or a document. A change from
# the autonomous loop (a `claude/loop-*` branch) is then set to merge itself once the required
# checks pass, if the repository allows auto-merge. Anything else is `human`, and CODEOWNERS asks
# the owner to review it.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  autonomy-class:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify
        id: c
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          cls=$(node scripts/autonomy-class.mjs < changed.txt 2> held.txt)
          echo "class=$cls" >> "$GITHUB_OUTPUT"
          { echo "### Autonomy class: \`$cls\`"; echo; sed 's/^/- /' held.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CLS: ${{ steps.c.outputs.class }}
        run: |
          gh pr edit "$PR" --remove-label autonomy:auto --remove-label autonomy:human >/dev/null 2>&1 || true
          gh pr edit "$PR" --add-label "autonomy:$CLS" || echo "::warning::The label autonomy:$CLS does not exist yet; create autonomy:auto and autonomy:human once."
      - name: Merge by itself (the loop's auto-class changes only)
        if: steps.c.outputs.class == 'auto' && startsWith(github.head_ref, 'claude/loop-')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --squash || echo "::warning::Auto-merge is off in this repository's settings; a person merges it."
