name: Autonomy class

# Which changes may merge without a person: the table in .github/autonomy.json, applied by
# scripts/autonomy-class.mjs to the paths a pull request changes (docs/AUTONOMY.md §5). The agent
# that wrote the change does not decide; this does.
#
# `auto` — every changed path is wording, an example, a guide topic or a document. A change from
# the autonomous loop (a `claude/loop-*` branch) is then merged by autonomy-merge.yml once CI has
# passed on that exact commit. Anything else is `human`, and CODEOWNERS asks the owner to review it.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  autonomy-class:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify
        id: c
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          cls=$(node scripts/autonomy-class.mjs < changed.txt 2> held.txt)
          echo "class=$cls" >> "$GITHUB_OUTPUT"
          { echo "### Autonomy class: \`$cls\`"; echo; sed 's/^/- /' held.txt; } >> "$GITHUB_STEP_SUMMARY"
      # The REST call creates a label that does not exist yet, so the repository needs no setup.
      - name: Label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CLS: ${{ steps.c.outputs.class }}
          REPO: ${{ github.repository }}
        run: |
          for old in autonomy:auto autonomy:human; do
            [ "$old" = "autonomy:$CLS" ] || gh api --method DELETE "repos/$REPO/issues/$PR/labels/$old" >/dev/null 2>&1 || true
          done
          gh api --method POST "repos/$REPO/issues/$PR/labels" -f "labels[]=autonomy:$CLS" >/dev/null \
            || echo "::warning::The label autonomy:$CLS could not be set; the class above still stands."
