name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Whether a read token for the private data repository has been given. Secrets cannot be
      # tested in an `if:` directly, so the answer is carried as a plain value.
      HAVE_DATA_TOKEN: ${{ secrets.MONITORING_DATA_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The BMW-derived data (E46M3-Monitoring-data, private) is what the twelve data tests check
      # the code against. Without the token those tests skip and say so (vitest.config.mts); with
      # it they run. The public-tree check below reads tracked files only, and these paths are
      # gitignored, so placing them cannot trip it. Add the secret once the data repository has been regenerated
      # from the .prg files: its telegrams.json predates a5635d4, and 16 tests fail on it
      # (docs/AUTONOMY.md §7).
      - name: Private data
        if: env.HAVE_DATA_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.MONITORING_DATA_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/mushitaro/E46M3-Monitoring-data.git" ../E46M3-Monitoring-data
          mkdir -p public/ecu-data tools/terms recordings
          cp -r ../E46M3-Monitoring-data/ecu-data/. public/ecu-data/
          cp -r ../E46M3-Monitoring-data/terms/. tools/terms/
          cp -r ../E46M3-Monitoring-data/recordings/. recordings/
          echo "SGBD_DUMP_DIR=$(cd ../E46M3-Monitoring-data/sgbd-dumps && pwd)" >> "$GITHUB_ENV"

      # First, and before anything is built: this repository is public, and nothing BMW-derived,
      # no dump, no VIN and no secret may be in it. The same check the pre-commit hook runs, here
      # for a commit made without the hook installed.
      - run: node scripts/check-public-tree.mjs

      # Order matters: typecheck and tests are cheap and catch the most, the
      # build is the slowest. Nothing here needs a vehicle or a serial port —
      # the device simulator drives the real transport and link.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          retention-days: 7

  # The generated ECU tables are committed, so a regeneration that silently
  # changes them must show up as a diff rather than as a surprise on someone's
  # next pull. This only runs where the inputs are available.
  data-pipeline:
    runs-on: windows-latest
    if: false # enable once C:\EDIABAS and the reference catalog are on a runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/gen_from_dump.py
      - run: python tools/extract_telegrams.py
      - run: python tools/gen_live_blocks.py
      - name: Fail if the generated data drifted
        run: git diff --exit-code -- ecu-data packages/ds2-mss54/src/liveValueBlocks.generated.ts
