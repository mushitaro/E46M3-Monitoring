name: engine-to-mainstays
# When a change that touches the diagnosis engine reaches main, propose it to every Mainstay as a pull
# request that moves its submodule of this repository to the new commit (docs/ENGINE.md §6;
# tsunagi-m-mainstay §6, operator 2026-11-12). M never writes to a Mainstay's main: its repository becomes
# the store's at hand-over. The PR asks for auto-merge, so it goes in only when the Mainstay's own required
# checks pass (its Cloudflare build, with the compatibility tests and its own); when they fail, the PR stays
# open and the store keeps the version it had.
#
# Engine changes are always a person's to merge here (.github/autonomy.json, packages/monitoring-engine is
# `human`), so what a Mainstay is offered has been looked at.
#
# Where each PR goes is the table .github/mainstays.json (repository, submodule path, base branch, and the
# name of its token secret). The tokens live in the Environment `mainstays` (Deployment branches: main
# only): one fine-grained token per Mainstay, for that one repository, Contents: Read and write (to push the
# PR's branch) and Pull requests: Read and write, with an expiry. The Mainstay's branch protection on its
# base branch (a PR and the required checks) is what keeps that token from writing to its main.
on:
  push:
    branches: [main]
    paths:
      - 'packages/monitoring-engine/**'
      - 'packages/ds2-core/**'
      - 'packages/ds2-mss54/**'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: engine-to-mainstays
  cancel-in-progress: false
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      mainstays: ${{ steps.read.outputs.mainstays }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mainstays.json
          sparse-checkout-cone-mode: false
      - id: read
        run: echo "mainstays=$(jq -c '.mainstays' .github/mainstays.json)" >> "$GITHUB_OUTPUT"
  propose:
    needs: list
    if: needs.list.outputs.mainstays != '[]'
    runs-on: ubuntu-latest
    environment: mainstays
    strategy:
      fail-fast: false
      matrix:
        mainstay: ${{ fromJSON(needs.list.outputs.mainstays) }}
    steps:
      - name: Open a PR that moves the submodule to this commit, with auto-merge
        env:
          GH_TOKEN: ${{ secrets[matrix.mainstay.tokenSecret] }}
          REPO: ${{ matrix.mainstay.repo }}
          PATH_IN_REPO: ${{ matrix.mainstay.path }}
          BASE: ${{ matrix.mainstay.base }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::${{ matrix.mainstay.tokenSecret }} is not set in the mainstays environment; $REPO was not offered this engine."
            exit 0
          fi
          short=${SHA:0:7}
          branch="engine/e46m3-monitoring-$short"
          head=$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq .object.sha)
          base_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)
          entry=$(gh api "repos/$REPO/git/trees/$base_tree?recursive=1" --jq ".tree[] | select(.path == \"$PATH_IN_REPO\") | \"\(.type) \(.sha)\"")
          if [ -z "$entry" ]; then
            echo "::warning::$REPO has no $PATH_IN_REPO (add the submodule there first); nothing offered."
            exit 0
          fi
          if [ "${entry%% *}" != "commit" ]; then
            echo "::error::$PATH_IN_REPO in $REPO is not a submodule ($entry)."
            exit 1
          fi
          if [ "${entry#* }" = "$SHA" ]; then echo "$REPO already has $short"; exit 0; fi
          if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then echo "$branch already exists in $REPO"; exit 0; fi
          tree=$(gh api "repos/$REPO/git/trees" -f base_tree="$base_tree" \
            -f "tree[][path]=$PATH_IN_REPO" -f "tree[][mode]=160000" -f "tree[][type]=commit" -f "tree[][sha]=$SHA" --jq .sha)
          commit=$(gh api "repos/$REPO/git/commits" -f tree="$tree" -f "parents[]=$head" \
            -f message="E46M3 /// MONITORING のエンジンを $short に上げる（mushitaro/E46M3-Monitoring@$SHA）" --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$commit" >/dev/null
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "E46M3 /// MONITORING の診断エンジンを mushitaro/E46M3-Monitoring@$SHA に上げます（$PATH_IN_REPO の gitlink だけ）。" \
            "このリポジトリの必須のチェック（Cloudflare のビルド：適合の試験とこのリポジトリの試験）が通ると自動で入ります。落ちたら入らず、今の版のままです。" \
            "vendor/ の中は直さないでください。直してほしいことは、エンジンの報告か運営者への頼みで届けてください。")
          number=$(gh api "repos/$REPO/pulls" -f title="エンジンを $short に上げる（E46M3 /// MONITORING）" -f head="$branch" -f base="$BASE" -f body="$body" --jq .number)
          # Older engine PRs from here that are still open are superseded by this one.
          for old in $(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq ".[] | select(.head.ref | startswith(\"engine/e46m3-monitoring-\")) | select(.number != $number) | .number"); do
            gh api -X PATCH "repos/$REPO/pulls/$old" -f state=closed >/dev/null || true
          done
          if ! gh pr merge "$number" --repo "$REPO" --auto --merge; then
            echo "::warning::$REPO #$number is open, but auto-merge could not be turned on (allow auto-merge and require the checks in that repository)."
          fi
          echo "offered $REPO #$number ($branch)"
