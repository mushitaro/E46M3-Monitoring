name: notify-gren-blue
# When a change that touches the diagnosis engine reaches main, move GREN BLUE's submodule of this
# repository to it (docs/ENGINE.md §6, operator 2026-11-11: the pin bump). GREN BLUE's Cloudflare
# build runs on that push, tests the combination and deploys only what passes, so a broken pair never
# reaches the store. GREN BLUE's own GitHub Actions are not needed.
#
# Engine changes are always a person's to merge here (.github/autonomy.json, packages/monitoring-engine
# is `human`), so what GREN BLUE receives has been looked at.
#
# The secret GREN_BLUE_PIN_TOKEN lives in the Environment `gren-blue` (Deployment branches: main
# only), not in the repository: a fine-grained token for mushitaro/tsunagi-gren-blue-private only,
# Contents: Read and write, with an expiry. Without it, or before GREN BLUE has the submodule at
# PATH_IN_REPO, this says so and does nothing.
on:
  push:
    branches: [main]
    paths:
      - 'packages/monitoring-engine/**'
      - 'packages/ds2-core/**'
      - 'packages/ds2-mss54/**'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: notify-gren-blue
  cancel-in-progress: false
jobs:
  pin:
    runs-on: ubuntu-latest
    environment: gren-blue
    steps:
      - name: Move GREN BLUE's submodule to this commit (fast-forward only)
        env:
          GH_TOKEN: ${{ secrets.GREN_BLUE_PIN_TOKEN }}
          REPO: mushitaro/tsunagi-gren-blue-private
          PATH_IN_REPO: vendor/E46M3-Monitoring
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::GREN_BLUE_PIN_TOKEN is not set in the gren-blue environment; GREN BLUE was not told."
            exit 0
          fi
          for attempt in 1 2 3; do
            head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            base_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)
            entry=$(gh api "repos/$REPO/git/trees/$base_tree?recursive=1" --jq ".tree[] | select(.path == \"$PATH_IN_REPO\") | \"\(.type) \(.sha)\"")
            if [ -z "$entry" ]; then
              echo "::warning::$REPO has no $PATH_IN_REPO yet (add the submodule there first); nothing moved."
              exit 0
            fi
            if [ "${entry%% *}" != "commit" ]; then
              echo "::error::$PATH_IN_REPO in $REPO is not a submodule ($entry)."
              exit 1
            fi
            if [ "${entry#* }" = "$SHA" ]; then echo "already at $SHA"; exit 0; fi
            tree=$(gh api "repos/$REPO/git/trees" -f base_tree="$base_tree" \
              -f "tree[][path]=$PATH_IN_REPO" -f "tree[][mode]=160000" -f "tree[][type]=commit" -f "tree[][sha]=$SHA" --jq .sha)
            commit=$(gh api "repos/$REPO/git/commits" -f tree="$tree" -f "parents[]=$head" \
              -f message="E46M3 /// MONITORING のエンジンを ${SHA:0:7} に上げる（mushitaro/E46M3-Monitoring@$SHA）" --jq .sha)
            # Fast-forward only: if someone moved GREN BLUE's main in between, build the commit again.
            if gh api -X PATCH "repos/$REPO/git/refs/heads/main" -f sha="$commit" -F force=false >/dev/null; then
              echo "pinned $PATH_IN_REPO to $SHA ($commit)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::could not fast-forward $REPO main"
          exit 1
